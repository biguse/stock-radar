name: daily-market-record

on:
  schedule:
    # 매일 13:00 UTC = 22:00 KST (한국 장 마감 후, 미국 전일 데이터 확정 후)
    - cron: '0 13 * * 1-6'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-market-record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 무결성 검사가 직전 커밋과 대조한다
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          pip install --quiet pykrx

      # KRX 로그인이 막히거나 형식이 바뀌어도 코스피·FRED 기록은 계속되어야 하므로
      # 이 단계만 실패를 허용한다. PER/PBR은 다음 실행에서 따라잡는다.
      - name: Update KOSPI valuation (KRX)
        continue-on-error: true
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python scripts/fetch-krx-valuation.py

      - name: Append market row and merge valuation
        run: node scripts/record-daily.mjs

      # 데이터가 하루치 늘면 구간 통계도 다시 계산한다 (10,000회 × 블록 3종, 약 40초)
      - name: Rebuild bootstrap intervals
        run: node scripts/build-bootstrap.mjs

      # 원자료가 바뀌는 지점이 바로 여기다. 커밋하기 전에 막는다.
      # 새 행 추가는 통과하고, 과거 행이 사라지거나 바뀌면 실패한다.
      - name: Data integrity gate
        run: python3 scripts/verify_data_integrity.py

      # 정상 증분이었으므로 승인된 상태 기록을 현재 파일로 갱신한다.
      # (intentionalChanges는 그대로 보존된다)
      - name: Refresh manifest
        run: python3 scripts/verify_data_integrity.py --update-manifest

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-history.json data/market-history.manifest.json data/krx-valuation.json data/bootstrap.json
          git commit -m "chore: 시장 데이터 일일 기록 $(date -u +%Y-%m-%d)"
          git push
