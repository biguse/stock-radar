name: build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # ── 교차검증 ──────────────────────────────────────────────
      # 파이썬으로 독립 재계산한 값과 운영 API의 값을 대조한다.
      # 두 구현(TypeScript / Python)이 어긋나면 여기서 실패한다.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification deps
        run: pip install --quiet numpy scipy

      - name: Start server
        run: |
          npm start &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/thermometer -o /dev/null && break
            sleep 2
          done

      - name: Cross-check TypeScript vs Python
        run: |
          {
            echo '## 교차검증 — 독립 재계산 ↔ 운영 API'
            echo '```'
            python3 scripts/verify_claims.py --api http://localhost:3000/api/thermometer
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Cross-check technical signals
        run: |
          {
            echo '## 교차검증 — 후행 추세 지표 (골든크로스·MACD·볼린저)'
            echo '```'
            python3 scripts/verify_technical.py --api http://localhost:3000/api/thermometer
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Full diagnostic report
        if: always()
        run: |
          {
            echo '## 진단 리포트 (민감도·부트스트랩)'
            echo '```'
            python3 scripts/verify_claims.py
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 2차 검증 진단 — 블록 민감도, 후보 선택 편향, 검사 공백 감사
      # (게이트가 아니라 리포트. 22초 정도 걸린다)
      - name: Second-review diagnostics
        if: always()
        run: |
          {
            echo '## 2차 검증 진단 — 민감도·선택편향·검사공백'
            echo '```'
            python3 scripts/verify_second_review.py
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Technical signal report
        if: always()
        run: |
          {
            echo '## 후행 추세 지표 — 1년 뒤 결과'
            echo '```'
            python3 scripts/verify_technical.py
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
